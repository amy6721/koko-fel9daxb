<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>摳摳</title>
  <meta name="description" content="摳摳：個人記帳與資產管理">
  <meta name="theme-color" content="#FFF8F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="摳摳">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 先套用主題，避免深色模式閃白
    try {
      var p = JSON.parse(localStorage.getItem('koko:pref:v1') || '{}');
      var t = p.theme && p.theme !== 'auto' ? p.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div class="app">
    <main id="view" aria-live="polite"></main>
    <nav class="nav" id="nav" aria-label="主要導覽"></nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">請開啟 JavaScript 才能使用摳摳。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
